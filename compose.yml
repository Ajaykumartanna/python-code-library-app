---
services:
  db:
    image: ajaykumartanna/ajay:database-${BUILD_NUMBER}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    volumes:
      - db_data:/var/lib/mysql

  auth_service:
    image: ajaykumartanna/ajay:authserver-${BUILD_NUMBER}
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork

  book_service:
    image: ajaykumartanna/ajay:bookserver-${BUILD_NUMBER}
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork

  borrow_service:
    image: ajaykumartanna/ajay:borrowserver-${BUILD_NUMBER}
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork

  frontend:
    image: ajaykumartanna/ajay:frontend-${BUILD_NUMBER}
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay

volumes:
  db_data:
